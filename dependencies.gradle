// Below Core is not published to a maven: the build uses the jars of a Below Core checkout (default: the sibling
// directory ../BelowCore after `./gradlew build` there; override with -Pbellow.dir=<path>).
// The code compiles against the API jar only, so nothing outside com.akashiic.bellow.api can be used by mistake;
// dev runs load the full dev jar.
def bellowDir = file(project.findProperty("bellow.dir") ?: "../BelowCore")
def bellowJar = { String suffix ->
    def found = fileTree(dir: new File(bellowDir, "build/libs"), include: "AkashicBellow-*-${suffix}.jar").files.sort()
    if (found.isEmpty()) {
        throw new GradleException("Below Core ${suffix} jar not found in ${bellowDir}/build/libs: run ./gradlew build there"
            + " (or pass -Pbellow.dir=<Below Core checkout>)")
    }
    return found.last()
}

dependencies {
    implementation("com.github.GTNewHorizons:GTNHLib:0.11.40:dev")

    compileOnly(files(bellowJar("api")))
    runtimeOnlyNonPublishable(files(bellowJar("dev")))
    // Below Core's own runtime dependencies
    runtimeOnlyNonPublishable("com.falsepattern:chunkapi-mc1.7.10:0.8.4:dev")
    runtimeOnlyNonPublishable("com.falsepattern:falsepatternlib-mc1.7.10:1.12.2:dev")

    // Et Futurum Requiem provides every cave block; it is only looked up by registry name at runtime.
    runtimeOnlyNonPublishable("ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.59-GTNH:dev")

    compileOnly("org.jetbrains:annotations:26.0.2")

    testImplementation(platform('org.junit:junit-bom:5.9.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
